<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Практические работы — интернет-маркетинг</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7f8;
      color: #171717;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 42px;
      line-height: 1.1;
    }

    .subtitle {
      margin: 0 0 40px;
      color: #666;
      font-size: 18px;
    }

    .work {
      display: block;
      margin: 10px 0;
      padding: 18px 20px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      color: #111;
      text-decoration: none;
      font-size: 18px;
      line-height: 1.35;
      transition: 0.15s ease;
    }

    .work:hover {
      border-color: #111;
      transform: translateY(-1px);
    }
  </style>
</head>

<body>

  <main>
    <h1>Практические работы</h1>
    <p class="subtitle">Интернет-маркетинг · Skillbox · 2026</p>

    {% for work in site.static_files %}
      {% if work.extname == ".html" %}
        <a class="work" href="{{ work.path | relative_url }}">
          {{ work.basename | replace: "_", " " }}
        </a>
      {% endif %}
    {% endfor %}

  </main>

</body>
</html>
